name: Construire l'app iOS
# Lancement manuel (onglet Actions) ou sur un tag v* : les machines macOS coûtent 10x plus de minutes GitHub.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: '[ -d ios ] || npm run ios:init'
      - run: npm run ios:sync
      - name: Paysage, plein écran et icône
        run: |
          P=ios/App/App/Info.plist
          for K in UISupportedInterfaceOrientations "UISupportedInterfaceOrientations~ipad"; do
            /usr/libexec/PlistBuddy -c "Delete :$K" "$P" || true
            /usr/libexec/PlistBuddy -c "Add :$K array" "$P"
            /usr/libexec/PlistBuddy -c "Add :$K:0 string UIInterfaceOrientationLandscapeLeft" "$P"
            /usr/libexec/PlistBuddy -c "Add :$K:1 string UIInterfaceOrientationLandscapeRight" "$P"
          done
          /usr/libexec/PlistBuddy -c "Delete :UIStatusBarHidden" "$P" || true
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarHidden bool true" "$P"
          /usr/libexec/PlistBuddy -c "Delete :UIViewControllerBasedStatusBarAppearance" "$P" || true
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" "$P"
          /usr/libexec/PlistBuddy -c "Delete :UIRequiresFullScreen" "$P" || true
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" "$P"
          ICONS=ios/App/App/Assets.xcassets/AppIcon.appiconset
          for f in "$ICONS"/*.png; do sips -s format png assets/icon.png --out "$f" >/dev/null; done
      - name: Compiler (sans signature)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -40
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP" && zip -qry TurboBolides-non-signe.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: turbo-bolides-ipa
          path: ${{ runner.temp }}/TurboBolides-non-signe.ipa
